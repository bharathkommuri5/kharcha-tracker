# Render blueprint — https://render.com/docs/blueprint-spec
# Creates: 1 Postgres DB, 1 FastAPI web service, 1 static site.
#
# After the FIRST deploy you must set the cross-URLs (they aren't known until the
# services exist) — see docs/deploy-render.md:
#   - kharcha-api   -> CORS_ORIGINS   = https://<static-site-url>
#   - kharcha-web   -> VITE_API_URL   = https://<api-url>
# and the Google / SMTP secrets on kharcha-api.

databases:
  - name: kharcha-db
    plan: free
    databaseName: kharcha
    user: kharcha

services:
  # ---------------------------------------------------------------- backend
  - type: web
    name: kharcha-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kharcha-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: DEV_AUTH
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false          # set in dashboard
      - key: CORS_ORIGINS
        sync: false          # set to the static site URL after first deploy
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  # ---------------------------------------------------------------- frontend
  - type: web
    name: kharcha-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # set to the kharcha-api URL after first deploy
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_DEV_AUTH
        value: "false"
