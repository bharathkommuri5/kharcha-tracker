# Render blueprint — https://render.com/docs/blueprint-spec
# Creates: 1 FastAPI web service, 1 static site. Postgres is external (Neon).
#
# Set these as env vars after the services exist (see docs/deploy-render.md):
#   - kharcha-api : DATABASE_URL, GOOGLE_CLIENT_ID, SUPERADMIN_EMAILS,
#                   CORS_ORIGINS (= https://<web-url>), SMTP_USER/APP_PASSWORD/FROM
#   - kharcha-web : VITE_API_URL (= https://<api-url>), VITE_GOOGLE_CLIENT_ID

services:
  # ---------------------------------------------------------------- backend
  - type: web
    name: kharcha-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # migration runs on every start (idempotent); avoids needing a paid pre-deploy step
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false          # Neon Postgres connection string
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: DEV_AUTH
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false          # set in dashboard
      - key: SUPERADMIN_EMAILS
        sync: false          # comma-separated emails that can manage teams
      - key: CORS_ORIGINS
        sync: false          # set to the static site URL after first deploy
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  # ---------------------------------------------------------------- frontend
  - type: web
    name: kharcha-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # set to the kharcha-api URL after first deploy
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_DEV_AUTH
        value: "false"
